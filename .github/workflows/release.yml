name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SLN: media management app/media management app.slnx
  APP_PROJ: media management app/media management app/media management app.csproj
  APP_DIR: media management app/media management app

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must be on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: ./.github/actions/build-test

      - name: Check stamped version
        shell: pwsh
        run: |
          $v = (Get-Item "out/publish/media management app.exe").VersionInfo.ProductVersion
          $expected = "$env:GITHUB_REF_NAME".TrimStart('v')
          Write-Host "ProductVersion=$v expected=$expected"
          if (-not $v.StartsWith($expected)) { throw "Exe version '$v' does not match tag '$env:GITHUB_REF_NAME'" }

      - name: Package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $stage = "out/stage"
          New-Item -ItemType Directory -Force $stage, "$stage/licenses" | Out-Null
          Copy-Item -Recurse out/publish/* $stage
          Copy-Item "$env:APP_DIR/THIRD_PARTY_NOTICES.md" $stage
          Copy-Item "$env:APP_DIR/ThirdParty/Sonarr.Parser/LICENSE.md" "$stage/licenses/Sonarr.Parser-LICENSE.md"
          Copy-Item "$env:APP_DIR/ThirdParty/Sonarr.Parser/ATTRIBUTION.md" "$stage/licenses/Sonarr.Parser-ATTRIBUTION.md"
          $zip = "out/MediaManager-$tag-win-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes --title "Media Manager $GITHUB_REF_NAME")
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" out/MediaManager-*-win-x64.zip out/SHA256SUMS.txt
